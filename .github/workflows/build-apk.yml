name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Project Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Setup Cordova & Build APK
        run: |
          npm install -g cordova
          cordova create app com.anurag.chorsipahi "Chor Sipahi"
          cd app
          rm -rf www/*
          # Copy compiled build output (dist or build folder) into www
          if [ -d "../dist" ]; then
            cp -r ../dist/* www/
          elif [ -d "../build" ]; then
            cp -r ../build/* www/
          fi
          cordova platform add android
          cordova plugin add cordova-plugin-whitelist || true
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chor-Sipahi-Game-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
