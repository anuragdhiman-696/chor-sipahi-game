name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build React Client
        run: |
          cd client
          npm install
          npm run build

      - name: Setup Cordova & Build APK
        run: |
          npm install -g cordova
          cordova create app com.anurag.chorsipahi "Chor Sipahi"
          cd app
          rm -rf www/*
          cp -r ../client/dist/* www/

          # Add Android Platform & Native Plugins
          cordova platform add android
          cordova plugin add cordova-plugin-media-capture
          cordova plugin add cordova-plugin-android-permissions

          # Inject WebView Hardware & Microphone Access Flags into config.xml
          sed -i 's|</widget>|  <preference name="MediaPlaybackRequiresUserAction" value="false" />\n  <preference name="AllowInlineMediaPlayback" value="true" />\n  <preference name="android-targetSdkVersion" value="33" />\n  <config-file target="AndroidManifest.xml" parent="/*">\n    <uses-permission name="android.permission.RECORD_AUDIO" />\n    <uses-permission name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission name="android.permission.AUDIO_CAPTURE" />\n  </config-file>\n</widget>|' config.xml

          # Copy Icon safely if present
          if [ -f "../client/public/icon.png" ]; then
            cp ../client/public/icon.png icon.png
            sed -i 's|</widget>|  <icon src="icon.png" />\n</widget>|' config.xml
          fi

          # Build Debug APK
          cordova build android --debug

          # Rename output APK
          mv platforms/android/app/build/outputs/apk/debug/app-debug.apk platforms/android/app/build/outputs/apk/debug/Chor-Sipahi.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chor-Sipahi-APK
          path: app/platforms/android/app/build/outputs/apk/debug/Chor-Sipahi.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Chor Sipahi Game (Build #${{ github.run_number }})
          body: |
            🎮 **Chor Sipahi Game - Android Release**
            
            - Added native WebView audio capture permissions
            - Ready for direct installation on Android
          files: app/platforms/android/app/build/outputs/apk/debug/Chor-Sipahi.apk
