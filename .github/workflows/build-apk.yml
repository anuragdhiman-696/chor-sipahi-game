name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

# Grants permission to create Releases
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build React Client
        run: |
          cd client
          npm install
          npm run build

      - name: Setup Cordova & Build APK
        run: |
          npm install -g cordova
          cordova create app com.anurag.chorsipahi "Chor Sipahi"
          cd app
          rm -rf www/*
          cp -r ../client/dist/* www/

          # Safely inject icon into config.xml using Node.js
          if [ -f "../client/public/icon.png" ]; then
            cp ../client/public/icon.png icon.png
            node -e '
              const fs = require("fs");
              let config = fs.readFileSync("config.xml", "utf8");
              config = config.replace("</widget>", "    <icon src=\"icon.png\" />\n</widget>");
              fs.writeFileSync("config.xml", config);
            '
          fi

          cordova platform add android
          cordova build android --debug

          # Rename output APK to Chor-Sipahi.apk
          mv platforms/android/app/build/outputs/apk/debug/app-debug.apk platforms/android/app/build/outputs/apk/debug/Chor-Sipahi.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Chor Sipahi Game (Build #${{ github.run_number }})
          body: |
            🎮 **Chor Sipahi Game - Android Release**
            
            - Pre-configured live multiplayer backend
            - Ready for direct installation on Android
          files: app/platforms/android/app/build/outputs/apk/debug/Chor-Sipahi.apk
