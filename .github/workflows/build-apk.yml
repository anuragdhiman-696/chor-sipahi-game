name: Build and Release Android APK

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        working-directory: client
        run: npm ci

      - name: Build Frontend
        working-directory: client
        run: npm run build

      - name: Prepare Cordova Web Assets
        run: |
          rm -rf www
          mkdir -p www
          cp -r client/dist/. www/

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"
          yes | sdkmanager --licenses || true

      - name: Install Cordova CLI
        run: npm install -g cordova@latest

      - name: Add Cordova Android Platform & Plugins
        run: |
          cordova platform remove android --no-telemetry || true
          cordova platform add android@13.0.0 --no-telemetry
          cordova plugin add cordova-plugin-android-permissions --no-telemetry

      - name: Build Debug APK
        run: |
          cordova build android --debug --no-telemetry

      - name: Find APK
        run: |
          echo "Generated APK files:"
          find platforms/android -type f -name "*.apk" -print

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chor-sipahi-debug-apk
          path: platforms/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "latest"
          name: "Chor Sipahi Latest APK Build"
          body: "Automated Android APK build from latest commit."
          files: platforms/android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
