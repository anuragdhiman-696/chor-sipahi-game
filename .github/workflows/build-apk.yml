name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build React Client
        working-directory: client
        run: |
          npm install
          npm run build

      - name: Setup Cordova & Build APK
        run: |
          npm install -g cordova

          echo "Creating Cordova project..."
          cordova create app com.anurag.chorsipahi "Chor Sipahi"

          cd app

          echo "Copying React build..."
          rm -rf www/*
          cp -r ../client/dist/* www/

          echo "Copying app icon..."
          if [ -f "../client/public/icon.png" ]; then
            cp ../client/public/icon.png icon.png
          fi

          echo "Configuring Cordova..."

          node <<'EOF'
          const fs = require("fs");

          let xml = fs.readFileSync("config.xml", "utf8");

          const preferences = `
              <preference name="MediaPlaybackRequiresUserAction" value="false" />
              <preference name="AllowInlineMediaPlayback" value="true" />
          `;

          xml = xml.replace("</widget>", preferences + "\n</widget>");

          if (fs.existsSync("icon.png")) {
            xml = xml.replace(
              "</widget>",
              '    <icon src="icon.png" />\n</widget>'
            );
          }

          fs.writeFileSync("config.xml", xml);
          EOF

          echo "Adding Android platform..."
          cordova platform add android

          echo "Adding media capture plugin..."
          cordova plugin add cordova-plugin-media-capture

          echo "Building APK..."
          cordova build android --debug

          echo "Renaming APK..."
          mv \
            platforms/android/app/build/outputs/apk/debug/app-debug.apk \
            platforms/android/app/build/outputs/apk/debug/Chor-Sipahi.apk

          echo "APK successfully created!"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chor-Sipahi-APK
          path: app/platforms/android/app/build/outputs/apk/debug/Chor-Sipahi.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Chor Sipahi Game (Build #${{ github.run_number }})
          body: |
            🎮 Chor Sipahi Game - Android Release

            Build #${{ github.run_number }}

            React client packaged using Apache Cordova.
          files: app/platforms/android/app/build/outputs/apk/debug/Chor-Sipahi.apk
