name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        working-directory: client
        run: npm install

      - name: Build Frontend
        working-directory: client
        run: npm run build

      - name: Prepare Cordova Web Assets
        run: |
          rm -rf www
          mkdir -p www
          cp -r client/dist/. www/

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: Install Gradle 7.6 (Overrides System Gradle 9.x)
        run: |
          wget -q https://services.gradle.org/distributions/gradle-7.6-bin.zip
          unzip -q gradle-7.6-bin.zip
          sudo mv gradle-7.6 /opt/gradle-7.6
          echo "/opt/gradle-7.6/bin" >> $GITHUB_PATH

      - name: Install Cordova CLI
        run: npm install -g cordova@12.0.0

      - name: Add Cordova Android Platform
        run: |
          cordova platform add android@12.0.0 --no-telemetry

      - name: Build Debug APK
        run: |
          cordova build android --debug --no-telemetry

      - name: Verify APK Generation
        run: |
          echo "Searching for generated APK files..."
          find platforms/android -type f -name "*.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chor-sipahi-debug-apk
          path: platforms/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
