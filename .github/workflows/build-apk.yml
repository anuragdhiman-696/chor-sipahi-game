name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

# Grants permission to create Releases
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build React Client
        run: |
          cd client
          npm install
          npm run build

      - name: Setup Cordova & Build APK
        run: |
          npm install -g cordova
          cordova create app com.anurag.chorsipahi "Chor Sipahi"
          cd app
          rm -rf www/*
          cp -r ../client/dist/* www/

          # Inject icon and Microphone permissions into config.xml safely using Node.js
          node -e '
            const fs = require("fs");
            let config = fs.readFileSync("config.xml", "utf8");
            
            // Add custom android permissions namespace and tags
            const micPermissions = `
  <widget xmlns:android="http://schemas.android.com/apk/res/android">
  <config-file target="AndroidManifest.xml" parent="/*">
    <uses-permission name="android.permission.RECORD_AUDIO" />
    <uses-permission name="android.permission.MODIFY_AUDIO_SETTINGS" />
  </config-file>`;

            let updated = config.replace("<widget>", micPermissions);

            if (fs.existsSync("../client/public/icon.png")) {
              fs.copyFileSync("../client/public/icon.png", "icon.png");
              updated = updated.replace("</widget>", "    <icon src=\"icon.png\" />\n</widget>");
            }

            fs.writeFileSync("config.xml", updated);
          '

          cordova platform add android
          cordova build android --debug

          # Rename output APK to Chor-Sipahi.apk
          mv platforms/android/app/build/outputs/apk/debug/app-debug.apk platforms/android/app/build/outputs/apk/debug/Chor-Sipahi.apk

      - name: Upload APK Artifact (Actions Download Button)
        uses: actions/upload-artifact@v4
        with:
          name: Chor-Sipahi-APK
          path: app/platforms/android/app/build/outputs/apk/debug/Chor-Sipahi.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Chor Sipahi Game (Build #${{ github.run_number }})
          body: |
            🎮 **Chor Sipahi Game - Android Release**
            
            - Includes Microphone / Audio permissions
            - Pre-configured live multiplayer backend
            - Ready for direct installation on Android
          files: app/platforms/android/app/build/outputs/apk/debug/Chor-Sipahi.apk
