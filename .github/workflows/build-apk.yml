name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build React Client App
        run: |
          cd client
          npm install
          npm run build

      - name: Prepare Cordova Project & Inject Permissions
        run: |
          npm install -g cordova
          
          # Strip missing icon tags from config.xml if present
          sed -i '/<icon src="res\/icon.png" \/>/d' config.xml || true
          
          # Initialize Cordova wrapper container
          cordova create temp_mobile com.chorsipahi.game "Chor Sipahi"
          
          # Copy custom config and React build into Cordova folder
          cp -f config.xml temp_mobile/config.xml
          cp -r client/dist/* temp_mobile/www/
          
          # Add platform and permissions plugin
          cd temp_mobile
          cordova platform add android
          cordova plugin add cordova-plugin-android-permissions

      - name: Build Android APK
        run: |
          cd temp_mobile
          cordova build android --verbose

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: temp_mobile/platforms/android/app/build/outputs/apk/debug/app-debug.apk