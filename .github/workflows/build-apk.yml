name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build React Client
        run: |
          cd client
          npm install
          npm run build

      - name: Setup Cordova & Build APK
        run: |
          npm install -g cordova
          cordova create app com.anurag.chorsipahi "Chor Sipahi"
          cd app
          rm -rf www/*
          # Copy Vite dist folder contents to Cordova www directory
          cp -r ../client/dist/* www/
          cordova platform add android
          cordova plugin add cordova-plugin-whitelist || true
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chor-Sipahi-Game-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
