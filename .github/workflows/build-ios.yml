name: Build iOS App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build React Client
        run: |
          cd client
          npm install
          npm run build

      - name: Setup Cordova & Prepare iOS
        run: |
          npm install -g cordova
          cordova create app com.anurag.chorsipahi "Chor Sipahi"
          cd app
          rm -rf www/*
          cp -r ../client/dist/* www/

          # Safely inject icon into config.xml using Node.js
          if [ -f "../client/public/icon.png" ]; then
            cp ../client/public/icon.png icon.png
            node -e '
              const fs = require("fs");
              let config = fs.readFileSync("config.xml", "utf8");
              config = config.replace("</widget>", "    <icon src=\"icon.png\" />\n</widget>");
              fs.writeFileSync("config.xml", config);
            '
          fi

          cordova platform add ios
          cordova build ios --emulator -- --codeSignIdentity="" --developmentTeam=""

      - name: Package .ipa File
        run: |
          cd app/platforms/ios/build/emulator
          mkdir -p Payload
          cp -r "Chor Sipahi.app" Payload/
          zip -r Chor-Sipahi.ipa Payload

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-ios
          name: Chor Sipahi Game - iOS
          body: |
            🍎 **Chor Sipahi Game - iOS Release**
            
            - Includes unsigned `Chor-Sipahi.ipa`
            - Compatible with sideloading tools (AltStore, Sideloadly) or local Xcode signing
          files: app/platforms/ios/build/emulator/Chor-Sipahi.ipa
