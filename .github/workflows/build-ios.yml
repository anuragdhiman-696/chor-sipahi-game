name: Build iOS App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build React Client
        run: |
          cd client
          npm install
          npm run build

      - name: Setup Cordova & Prepare iOS Project
        run: |
          npm install -g cordova
          cordova create app com.anurag.chorsipahi "Chor Sipahi"
          cd app
          rm -rf www/*
          cp -r ../client/dist/* www/

          # Inject icon into config.xml safely using Node.js
          if [ -f "../client/public/icon.png" ]; then
            cp ../client/public/icon.png icon.png
            node -e '
              const fs = require("fs");
              let config = fs.readFileSync("config.xml", "utf8");
              config = config.replace("</widget>", "    <icon src=\"icon.png\" />\n</widget>");
              fs.writeFileSync("config.xml", config);
            '
          fi

          # Prepare native Xcode workspace files
          cordova platform add ios
          cordova prepare ios

      - name: Compile iOS App (Unsigned)
        run: |
          cd app/platforms/ios
          xcodebuild -workspace "Chor Sipahi.xcworkspace" \
                     -scheme "Chor Sipahi" \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     PROVISIONING_PROFILE_SPECIFIER="" \
                     build

      - name: Package .ipa File
        run: |
          cd app/platforms/ios
          mkdir -p build/Payload
          cp -r "build/Release-iphoneos/Chor Sipahi.app" build/Payload/
          cd build
          zip -r Chor-Sipahi.ipa Payload

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-ios
          name: Chor Sipahi Game - iOS
          body: |
            🍎 **Chor Sipahi Game - iOS Release**
            
            - Includes unsigned `Chor-Sipahi.ipa`
            - Installable via Sideloadly, AltStore, TrollStore, or local Xcode signing
          files: app/platforms/ios/build/Chor-Sipahi.ipa
